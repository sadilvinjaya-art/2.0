<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>365-Day Work & Marks Tracker</title>
  
  <!-- Custom App Icons matching images.png -->
  <link rel="apple-touch-icon" href="images.png">
  <link rel="icon" type="image/png" href="images.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f8f9fa;
    }
    h2, h3 {
      color: #333;
    }
    .chart-box {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      height: 420px;
    }
    .table-container {
      max-height: 500px;
      overflow-y: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      padding: 10px;
      border: 1px solid #e0e0e0;
    }
    th {
      background-color: #007bff;
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .works-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .work-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      background: #f0f4f8;
      padding: 6px 4px;
      border-radius: 4px;
      min-height: 58px;
      text-align: center;
      border: 1px solid #d0d7de;
    }
    .work-item span.title {
      line-height: 1.2;
      font-weight: 600;
    }
    .work-item span.pts {
      font-size: 9px;
      color: #28a745;
      font-weight: bold;
      margin-top: 2px;
    }
    .work-item input {
      cursor: pointer;
      margin-top: 4px;
    }
    .score-cell {
      font-weight: bold;
      color: #007bff;
      font-size: 16px;
    }
    .reset-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 15px;
      float: right;
    }
    .reset-btn:hover {
      background-color: #bd2130;
    }
    .date-label {
      font-size: 12px;
      line-height: 1.3;
    }

    /* Scrollable 365 Days Circular Tracker (Matches Table Scroll) */
    .days-circle-container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
      overflow: hidden;
    }
    .days-header {
      background-color: #007bff;
      color: white;
      padding: 12px 20px;
      margin: 0;
      font-size: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .days-container-scroll {
      max-height: 400px; /* Fixed scrollable height */
      overflow-y: auto;
      padding: 20px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 12px;
    }
    .day-badge {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #000000; /* Black background */
      border: 2px solid #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5px;
      box-sizing: border-box;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
    }
    .day-badge:hover {
      transform: scale(1.05);
    }
    .day-badge .day-num {
      font-size: 11px;
      font-weight: bold;
      color: #ffffff; /* White text */
    }
    .day-badge .day-date {
      font-size: 9px;
      color: #ffffff; /* White text */
      margin-top: 2px;
      line-height: 1.1;
    }
    
    /* Yellow Cross Overlay */
    .day-badge.crossed::after {
      content: '✕';
      position: absolute;
      font-size: 45px;
      color: #ffea00; /* Yellow cross */
      font-weight: bold;
      line-height: 1;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    }
    
    /* Current Active Day Highlight */
    .day-badge.today {
      border: 3px solid #ffea00;
      box-shadow: 0 0 10px rgba(255, 234, 0, 0.6);
    }
  </style>
</head>
<body>

  <button class="reset-btn" onclick="resetData()">Reset All Data</button>
  <h2>📈 365-Day Marks & Work Tracker</h2>
  
  <!-- Chart Container -->
  <div class="chart-box">
    <canvas id="marksChart"></canvas>
  </div>

  <h3>Daily Tasks Checklist (Custom Marks per Task / Max 100)</h3>
  <!-- Daily Tasks Table (Scrollable Box) -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 14%;">Date & Day</th>
          <th>20 Works Checklist</th>
          <th style="width: 10%;">Total Marks (0-100)</th>
        </tr>
      </thead>
      <tbody id="trackerTableBody">
        <!-- Generated by JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- 365 Days Circular Tracker (Scrollable Box) -->
  <div class="days-circle-container">
    <h3 class="days-header">🟡 365-Day Progress Circles (Scroll & Click to Cross/Uncross)</h3>
    <div class="days-container-scroll">
      <div class="days-grid" id="daysGrid">
        <!-- Generated by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    const totalDays = 365;
    const totalWorks = 20;

    const workLabels = [
      "Biology 1 page",            // Work 1
      "Physics 5 questions",       // Work 2
      "Chemistry 5 questions",     // Work 3
      "5 left arm overs",          // Work 4
      "5 right arm overs",         // Work 5
      "50 shots",                  // Work 6
      "50 catches",                // Work 7
      "10 minutes visualization",  // Work 8
      "10 minutes meditation",     // Work 9
      "1 Book page",               // Work 10
      "10 minutes skipping",       // Work 11
      "100 push ups",              // Work 12
      "20 pull ups",               // Work 13
      "Dumbbell flys 25 side",     // Work 14
      "Dumbbell flys front 25",    // Work 15
      "Military pull ups 10",      // Work 16
      "Barbell curl 10",           // Work 17
      "Planning",                  // Work 18
      "Good work",                 // Work 19
      "Extra work"                 // Work 20
    ];

    const workMarks = [
      10, 10, 10, 5, 5, 2.5, 2.5, 2.5, 10, 5, 
      2.5, 5, 2.5, 2.5, 2.5, 2.5, 2.5, 10, 5, 2.5
    ];

    // Dates Array & Current Date Setup
    const daysArray = [];
    const dateObjects = [];
    const startDate = new Date(2026, 7, 1); // August 1, 2026

    const today = new Date();
    today.setHours(0,0,0,0);

    for (let i = 0; i < totalDays; i++) {
      const currentDate = new Date(startDate);
      currentDate.setDate(startDate.getDate() + i);
      dateObjects.push(new Date(currentDate));

      const yearNum = currentDate.getFullYear();
      const monthName = currentDate.toLocaleString('en-US', { month: 'long' });
      const dayNum = currentDate.getDate();
      const dayName = currentDate.toLocaleString('en-US', { weekday: 'long' });

      daysArray.push(`${yearNum} ${monthName} ${dayNum} ${dayName}`);
    }
    
    let savedData = JSON.parse(localStorage.getItem('trackerData')) || {};
    let savedCrossedDays = JSON.parse(localStorage.getItem('crossedDaysData')) || {};
    const marksData = new Array(totalDays).fill(0);

    // Chart initialization
    const ctx = document.getElementById('marksChart').getContext('2d');
    const marksChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: daysArray,
        datasets: [{
          label: 'Total Marks',
          data: marksData,
          borderColor: '#007bff',
          backgroundColor: 'rgba(0, 123, 255, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.1,
          pointRadius: 1.5,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, title: { display: true, text: 'Marks (0 - 100)' } },
          x: { title: { display: true, text: 'Dates (365 Days)' } }
        }
      }
    });

    // Populate Table
    const tableBody = document.getElementById('trackerTableBody');

    for (let day = 1; day <= totalDays; day++) {
      const dayIndex = day - 1;
      const row = document.createElement('tr');

      let worksHtml = '<div class="works-grid">';
      for (let w = 1; w <= totalWorks; w++) {
        const isChecked = savedData[dayIndex] && savedData[dayIndex][w - 1] ? 'checked' : '';
        const labelName = workLabels[w - 1];
        const pts = workMarks[w - 1];

        worksHtml += `
          <div class="work-item">
            <span class="title">${labelName}</span>
            <span class="pts">+${pts}m</span>
            <input type="checkbox" class="day-${dayIndex}" data-pts="${pts}" ${isChecked} onchange="calculateMarks(${dayIndex})">
          </div>`;
      }
      worksHtml += '</div>';

      row.innerHTML = `
        <td class="date-label"><strong>${daysArray[dayIndex]}</strong></td>
        <td>${worksHtml}</td>
        <td class="score-cell" id="score-day-${dayIndex}">0</td>
      `;

      tableBody.appendChild(row);
      calculateMarks(dayIndex, false);
    }

    marksChart.update();

    // Populate 365 Black Round Badges
    const daysGrid = document.getElementById('daysGrid');

    for (let i = 0; i < totalDays; i++) {
      const dayNum = i + 1;
      const thisDate = dateObjects[i];
      
      const monthShort = thisDate.toLocaleString('en-US', { month: 'short' });
      const dayVal = thisDate.getDate();
      const yearVal = thisDate.getFullYear();

      const badge = document.createElement('div');
      badge.className = 'day-badge';

      // Check if day is manually crossed or auto-crossed
      const isManuallyCrossed = savedCrossedDays[i];
      const isAutoCrossed = (savedCrossedDays[i] === undefined) && (thisDate < today);

      if (isManuallyCrossed || isAutoCrossed) {
        badge.classList.add('crossed');
        savedCrossedDays[i] = true;
      }

      if (thisDate.getTime() === today.getTime()) {
        badge.classList.add('today');
      }

      badge.innerHTML = `
        <div class="day-num">Day ${dayNum}</div>
        <div class="day-date">${monthShort} ${dayVal}<br>${yearVal}</div>
      `;

      // Manual click event
      badge.onclick = function() {
        if (badge.classList.contains('crossed')) {
          badge.classList.remove('crossed');
          savedCrossedDays[i] = false;
        } else {
          badge.classList.add('crossed');
          savedCrossedDays[i] = true;
        }
        localStorage.setItem('crossedDaysData', JSON.stringify(savedCrossedDays));
      };

      daysGrid.appendChild(badge);
    }

    function calculateMarks(dayIndex, updateChart = true) {
      const checkboxes = document.querySelectorAll(`.day-${dayIndex}`);
      let totalDayMarks = 0;
      let dayState = [];

      checkboxes.forEach((cb) => {
        const pts = parseFloat(cb.getAttribute('data-pts'));
        if (cb.checked) {
          totalDayMarks += pts;
        }
        dayState.push(cb.checked);
      });

      const formattedMarks = Number.isInteger(totalDayMarks) ? totalDayMarks : totalDayMarks.toFixed(1);

      document.getElementById(`score-day-${dayIndex}`).innerText = formattedMarks;
      marksChart.data.datasets[0].data[dayIndex] = totalDayMarks;

      savedData[dayIndex] = dayState;
      localStorage.setItem('trackerData', JSON.stringify(savedData));

      if (updateChart) {
        marksChart.update();
      }
    }

    function resetData() {
      if (confirm("Are you sure you want to reset all your tracked data and crossed days?")) {
        localStorage.removeItem('trackerData');
        localStorage.removeItem('crossedDaysData');
        location.reload();
      }
    }
  </script>

</body>
</html>
